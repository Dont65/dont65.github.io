<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Dont65 | Просмотр реестра</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        
        <link rel="stylesheet" href="/assets/css/pages/chat-rules.css" />
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

        <style>
            :root {
                --primary-color: 42, 171, 238;
                --border-radius-l: 28px;
                --border-radius-m: 16px;
            }
            html { scroll-behavior: smooth; }
            body {
                font-family: "Roboto", sans-serif;
                margin: 0; padding: 40px 20px;
                display: flex; justify-content: center; align-items: flex-start;
                min-height: 100vh;
                background-color: #121212; background-size: cover; background-position: center; background-attachment: fixed;
                color: #ffffff; box-sizing: border-box;
            }
            body::before { content: ""; position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.4); z-index: -1; }
            body.light-theme { color: #1a1c1e; }
            body.light-theme::before { background-color: rgba(255, 255, 255, 0.4); }

            .container {
                width: 100%; max-width: 900px; padding: 40px;
                background-color: rgba(30, 30, 30, 0.75);
                backdrop-filter: blur(16px);
                border-radius: var(--border-radius-l);
                border: 1px solid rgba(255, 255, 255, 0.1);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                min-width: 0;
            }
            body.light-theme .container { background-color: rgba(255, 255, 255, 0.75); border-color: rgba(0, 0, 0, 0.1); }

            .block-header { text-align: center; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
            body.light-theme .block-header { border-bottom-color: rgba(0, 0, 0, 0.1); }
            .block-header h1 { margin: 0 0 12px 0; font-size: 32px; font-weight: 700; color: rgb(var(--primary-color)); }

            .cards-grid { display: flex; flex-direction: column; gap: 16px; }
            /* .container .info-card — выше по специфичности, чем .info-card в modals.css (там display:flex ломал раскладку) */
            .container .info-card { display: block; justify-content: normal; margin-bottom: 0; background-color: rgba(255, 255, 255, 0.05); padding: 24px; border-radius: var(--border-radius-m); text-align: left; min-width: 0; }
            body.light-theme .container .info-card { background-color: rgba(0, 0, 0, 0.05); }
            .info-label { font-weight: 700; color: rgb(var(--primary-color)); font-size: 20px; margin-bottom: 12px; }

            .status-message { text-align: center; font-size: 18px; margin-top: 50px; }
            .error { color: #ff5555; }
            .back-btn { display: inline-flex; align-items: center; gap: 8px; color: rgb(var(--primary-color)); text-decoration: none; margin-bottom: 24px; font-weight: bold; padding: 10px 20px; background: rgba(var(--primary-color), 0.1); border-radius: 12px; border: 1px solid rgb(var(--primary-color)); transition: 0.3s; }
            .back-btn:hover { background: rgb(var(--primary-color)); color: white; }

            /* ================= MARKDOWN ================= */
            .markdown-body { line-height: 1.7; overflow-wrap: anywhere; }
            .markdown-body > :first-child { margin-top: 0; }
            .markdown-body > :last-child { margin-bottom: 0; }
            .markdown-body img { max-width: 100%; border-radius: 12px; }
            .markdown-body hr { border: none; height: 1px; background: rgba(255, 255, 255, 0.15); margin: 28px 0; }
            body.light-theme .markdown-body hr { background: rgba(0, 0, 0, 0.15); }
            .markdown-body blockquote {
                margin: 16px 0; padding: 8px 18px;
                border-left: 4px solid rgb(var(--primary-color));
                background: rgba(var(--primary-color), 0.08);
                border-radius: 0 12px 12px 0;
            }
            .markdown-body blockquote > :first-child { margin-top: 0; }
            .markdown-body blockquote > :last-child { margin-bottom: 0; }
            /* Ссылки — в цвет акцента (markdown, json-карточки, txt) */
            .container a:not(.back-btn),
            .container a:not(.back-btn):visited {
                color: rgb(var(--primary-color)) !important;
                text-decoration: none;
                border-bottom: 1px solid rgba(var(--primary-color), 0.4);
                transition: 0.2s;
            }
            .container a:not(.back-btn):hover { border-bottom-color: rgb(var(--primary-color)); }

            /* Заголовки + якоря */
            .markdown-body h1, .markdown-body h2, .markdown-body h3,
            .markdown-body h4, .markdown-body h5, .markdown-body h6 {
                position: relative; scroll-margin-top: 24px;
                margin: 1.6em 0 0.6em; line-height: 1.3; font-weight: 700;
            }
            .markdown-body h1, .markdown-body h2 { color: rgb(var(--primary-color)); }
            .markdown-body h1 { font-size: 28px; }
            .markdown-body h2 { font-size: 24px; padding-bottom: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
            body.light-theme .markdown-body h2 { border-bottom-color: rgba(0, 0, 0, 0.1); }
            .markdown-body h3 { font-size: 20px; }
            .markdown-body h4 { font-size: 18px; }
            .markdown-body :target { animation: anchor-flash 1.6s ease-out; }
            @keyframes anchor-flash {
                0% { background: rgba(var(--primary-color), 0.35); }
                100% { background: transparent; }
            }
            .heading-anchor {
                position: absolute; left: -1.5em; top: 0; width: 1.5em; height: 100%;
                display: flex; align-items: center; justify-content: center;
                font-size: 0.6em; opacity: 0; border-bottom: none !important;
                transition: opacity 0.2s;
            }
            .markdown-body h1:hover .heading-anchor, .markdown-body h2:hover .heading-anchor,
            .markdown-body h3:hover .heading-anchor, .markdown-body h4:hover .heading-anchor,
            .markdown-body h5:hover .heading-anchor, .markdown-body h6:hover .heading-anchor,
            .heading-anchor:focus { opacity: 1; }
            .heading-anchor.copied { opacity: 1; }
            .container .heading-anchor.copied:not(.back-btn) { color: #4ade80 !important; }
            @media (max-width: 700px) {
                body { padding: 16px 10px; }
                .container { padding: 20px; }
                .heading-anchor { position: static; display: inline-flex; width: auto; height: auto; margin-left: 8px; opacity: 0.5; }
            }

            /* Таблицы */
            .table-wrap {
                margin: 20px 0; overflow-x: auto;
                border-radius: var(--border-radius-m);
                border: 1px solid rgba(255, 255, 255, 0.12);
                background: rgba(0, 0, 0, 0.15);
            }
            body.light-theme .table-wrap { border-color: rgba(0, 0, 0, 0.12); background: rgba(255, 255, 255, 0.4); }
            .table-wrap table { width: 100%; border-collapse: collapse; font-size: 15px; }
            .table-wrap th, .table-wrap td { padding: 12px 16px; text-align: left; vertical-align: top; overflow-wrap: normal; }
            .table-wrap th {
                background: rgba(var(--primary-color), 0.18);
                color: rgb(var(--primary-color));
                font-weight: 700; white-space: nowrap;
                border-bottom: 2px solid rgba(var(--primary-color), 0.5);
            }
            .table-wrap td { border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
            body.light-theme .table-wrap td { border-bottom-color: rgba(0, 0, 0, 0.08); }
            .table-wrap tbody tr:last-child td { border-bottom: none; }
            .table-wrap tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.04); }
            body.light-theme .table-wrap tbody tr:nth-child(even) { background: rgba(0, 0, 0, 0.04); }
            .table-wrap tbody tr { transition: background 0.15s; }
            .table-wrap tbody tr:hover { background: rgba(var(--primary-color), 0.12); }

            /* Блоки кода: стиль <pre> не трогаем, только иконка копирования в углу */
            .code-block { position: relative; }
            .copy-btn {
                position: absolute; top: 8px; right: 8px; z-index: 2;
                width: 32px; height: 32px; padding: 0;
                display: flex; align-items: center; justify-content: center;
                font-size: 14px; color: #fff; cursor: pointer;
                background: rgba(0, 0, 0, 0.45);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 8px;
                opacity: 0; transition: opacity 0.2s, background 0.2s, border-color 0.2s;
            }
            .code-block:hover .copy-btn, .copy-btn:focus-visible, .copy-btn.copied { opacity: 1; }
            .copy-btn:hover { background: rgba(var(--primary-color), 0.6); border-color: rgb(var(--primary-color)); }
            .copy-btn.copied { background: rgba(74, 222, 128, 0.35); border-color: #4ade80; }
            @media (hover: none) { .copy-btn { opacity: 0.8; } }
            .markdown-body :not(pre) > code {
                font-size: 0.9em; padding: 2px 7px; border-radius: 6px;
                background: rgba(var(--primary-color), 0.15);
            }

            mark.search-highlight { background: rgba(var(--primary-color), 0.45); color: inherit; border-radius: 3px; padding: 0 2px; }
        </style>

</head>
    <body>
        <div class="container">
            <a href="#" onclick="history.back(); return false;" class="back-btn">
                <i class="fas fa-arrow-left"></i> Назад
            </a>

            <!-- ПОИСК С ПОДСКАЗКАМИ (НОВЫЙ ДИЗАЙН) -->
            <div class="search-wrapper" id="searchBox" style="display: none;">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Поиск по документу..." autocomplete="off">
                    <button class="search-action-btn" id="searchBtn">
                        Поиск <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
                <div class="search-suggestions" id="searchSuggestions"></div>
            </div>

            <div id="app">
                <div class="status-message" id="status">
                    <i class="fas fa-circle-notch fa-spin"></i>
                    <span>Загрузка данных...</span>
                </div>
            </div>
        </div>

        <script>
            /* ================= УТИЛИТЫ ================= */
            async function copyText(text) {
                try {
                    await navigator.clipboard.writeText(text);
                    return true;
                } catch (e) {
                    // запасной вариант (http, старые браузеры)
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
                    document.body.appendChild(ta);
                    ta.select();
                    let ok = false;
                    try { ok = document.execCommand('copy'); } catch (_) {}
                    document.body.removeChild(ta);
                    return ok;
                }
            }

            function slugify(text) {
                return text.trim().toLowerCase()
                    .replace(/[^\p{L}\p{N}\s-]/gu, '')
                    .replace(/\s+/g, '-');
            }

            function findById(root, id) {
                try { return root.querySelector('#' + CSS.escape(id)); } catch (_) { return null; }
            }

            function scrollToHash(root, hash, updateUrl) {
                if (!hash) return false;
                let id = hash.replace(/^#/, '');
                try { id = decodeURIComponent(id); } catch (_) {}
                const target = findById(root, id) || findById(root, slugify(id));
                if (!target) return false;
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                if (updateUrl) {
                    const url = new URL(window.location);
                    url.hash = encodeURIComponent(target.id);
                    history.replaceState(null, '', url);
                }
                // перезапуск подсветки :target
                target.style.animation = 'none';
                void target.offsetWidth;
                target.style.animation = '';
                return true;
            }

            /* ================= УЛУЧШЕНИЕ MARKDOWN ================= */
            function enhanceMarkdown(root) {
                // 1) Заголовки -> якоря (#id)
                const used = new Map();
                root.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h => {
                    let base = slugify(h.textContent) || 'section';
                    let id = base;
                    if (used.has(base)) {
                        const n = used.get(base) + 1;
                        used.set(base, n);
                        id = `${base}-${n - 1}`;
                    } else {
                        used.set(base, 1);
                    }
                    h.id = id;

                    const a = document.createElement('a');
                    a.className = 'heading-anchor';
                    a.href = '#' + encodeURIComponent(id);
                    a.setAttribute('aria-label', 'Ссылка на раздел');
                    a.setAttribute('data-nosearch', '');
                    a.innerHTML = '<i class="fas fa-link"></i>';
                    h.appendChild(a);
                });

                // 2) Внешние ссылки — в новой вкладке
                root.querySelectorAll('a[href]').forEach(a => {
                    const href = a.getAttribute('href');
                    if (/^https?:\/\//i.test(href)) {
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                    }
                });

                // 3) Таблицы
                root.querySelectorAll('table').forEach(table => {
                    const wrap = document.createElement('div');
                    wrap.className = 'table-wrap';
                    table.parentNode.insertBefore(wrap, table);
                    wrap.appendChild(table);
                });

                // 4) Блоки кода: значок «копировать» в углу, оформление не меняем
                root.querySelectorAll('pre').forEach(pre => {
                    if (pre.parentElement.classList.contains('code-block')) return;
                    const code = pre.querySelector('code');

                    const block = document.createElement('div');
                    block.className = 'code-block';

                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'copy-btn';
                    btn.title = 'Копировать';
                    btn.setAttribute('aria-label', 'Копировать код');
                    btn.setAttribute('data-nosearch', '');
                    btn.innerHTML = '<i class="far fa-copy"></i>';

                    btn.addEventListener('click', async () => {
                        const text = (code || pre).textContent.replace(/\n$/, '');
                        const ok = await copyText(text);
                        btn.classList.toggle('copied', ok);
                        btn.innerHTML = ok ? '<i class="fas fa-check"></i>' : '<i class="fas fa-xmark"></i>';
                        setTimeout(() => {
                            btn.classList.remove('copied');
                            btn.innerHTML = '<i class="far fa-copy"></i>';
                        }, 1800);
                    });

                    pre.parentNode.insertBefore(block, pre);
                    block.appendChild(pre);
                    block.appendChild(btn);
                });

                // 5) Клики по внутренним ссылкам (#...) и якорям заголовков
                root.addEventListener('click', (e) => {
                    const a = e.target.closest('a[href^="#"]');
                    if (!a || !root.contains(a)) return;
                    e.preventDefault();
                    const hash = a.getAttribute('href');
                    if (scrollToHash(root, hash, true) && a.classList.contains('heading-anchor')) {
                        // клик по значку — копируем полную ссылку на раздел
                        copyText(window.location.href).then(ok => {
                            if (!ok) return;
                            a.classList.add('copied');
                            a.innerHTML = '<i class="fas fa-check"></i>';
                            setTimeout(() => {
                                a.classList.remove('copied');
                                a.innerHTML = '<i class="fas fa-link"></i>';
                            }, 1500);
                        });
                    }
                });

                window.addEventListener('hashchange', () => scrollToHash(root, window.location.hash, false));
            }

            /* ================= ПОИСК ================= */
            function initSmartSearch(container) {
                const searchInput = document.getElementById('searchInput');
                const searchBtn = document.getElementById('searchBtn');
                const suggestionsBox = document.getElementById('searchSuggestions');
                
                const rawText = container.textContent || "";
                const words = rawText.match(/[а-яА-Яa-zA-ZёЁ]+/g) || []; 
                const uniqueWords = Array.from(new Set(words.map(w => w.toLowerCase()))).filter(w => w.length > 2);

                function updateSearchUrl(term) {
                    const url = new URL(window.location);
                    if (term) {
                        url.searchParams.set('search', term);
                    } else {
                        url.searchParams.delete('search');
                    }
                    history.replaceState(null, '', url);
                }

                function performSearch(term, skipUrlUpdate) {
                    if (!skipUrlUpdate) updateSearchUrl(term);
                    suggestionsBox.style.display = 'none';

                    container.querySelectorAll('mark.search-highlight').forEach(mark => {
                        const parent = mark.parentNode;
                        parent.replaceChild(document.createTextNode(mark.textContent), mark);
                        parent.normalize();
                    });

                    if (!term) return;

                    const escapedTerm = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const testRegex = new RegExp(escapedTerm, 'i');
                    const splitRegex = new RegExp(`(${escapedTerm})`, 'gi');
                    let firstMatch = null;
                    const nodesToReplace = [];

                    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
                    while (walker.nextNode()) {
                        const node = walker.currentNode;
                        const p = node.parentNode;
                        if (p.nodeName === 'MARK' || p.nodeName === 'SCRIPT') continue;
                        if (p.closest && p.closest('[data-nosearch]')) continue;
                        if (testRegex.test(node.nodeValue)) nodesToReplace.push(node);
                    }

                    nodesToReplace.forEach(node => {
                        const parts = node.nodeValue.split(splitRegex);
                        const frag = document.createDocumentFragment();
                        parts.forEach((part, i) => {
                            if (!part) return;
                            if (i % 2 === 1) {
                                const mark = document.createElement('mark');
                                mark.className = 'search-highlight';
                                mark.textContent = part;
                                frag.appendChild(mark);
                                if (!firstMatch) firstMatch = mark;
                            } else {
                                frag.appendChild(document.createTextNode(part));
                            }
                        });
                        node.parentNode.replaceChild(frag, node);
                    });

                    if (firstMatch) {
                        setTimeout(() => {
                            firstMatch.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }, 100);
                    }
                }

                searchInput.addEventListener('input', (e) => {
                    const val = e.target.value.toLowerCase().trim();
                    suggestionsBox.innerHTML = '';
                    if (val.length < 2) { 
                        suggestionsBox.style.display = 'none'; 
                        if (!val) performSearch(""); 
                        return; 
                    }

                    const matches = uniqueWords.filter(w => w.includes(val)).slice(0, 5);
                    if (matches.length > 0) {
                        matches.forEach(match => {
                            const div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.textContent = match;
                            div.addEventListener('click', () => {
                                searchInput.value = match;
                                performSearch(match);
                            });
                            suggestionsBox.appendChild(div);
                        });
                        suggestionsBox.style.display = 'block';
                    } else {
                        suggestionsBox.style.display = 'none';
                    }
                });

                searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') performSearch(searchInput.value.trim()); });
                searchBtn.addEventListener('click', () => performSearch(searchInput.value.trim()));
                document.addEventListener('click', (e) => { if (!e.target.closest('.search-container')) suggestionsBox.style.display = 'none'; });

                // Если в ссылке уже есть ?search=..., подставляем и сразу ищем
                const initialTerm = new URLSearchParams(window.location.search).get('search');
                if (initialTerm) {
                    searchInput.value = initialTerm;
                    performSearch(initialTerm, true);
                }
            }

            /* ================= ЗАГРУЗКА ================= */
            document.addEventListener("DOMContentLoaded", () => {
                const appDiv = document.getElementById("app");
                const searchBox = document.getElementById("searchBox");
                
                const savedTheme = localStorage.getItem("theme");
                if (savedTheme === "light") document.body.classList.add("light-theme");
                const savedColor = localStorage.getItem("primaryColor");
                if (savedColor) document.documentElement.style.setProperty("--primary-color", savedColor);
                const savedWallpaper = localStorage.getItem("wallpaper") || "background.jpg";
                if (window.applyWallpaper) window.applyWallpaper(savedWallpaper);

                const urlParams = new URLSearchParams(window.location.search);
                const fileName = urlParams.get("file");

                if (!fileName) {
                    appDiv.innerHTML = `<div class="status-message error"><i class="fas fa-exclamation-triangle"></i><span>Не указан параметр file.</span></div>`;
                    return;
                }

                const fileExt = fileName.split('.').pop().toLowerCase();

                fetch(fileName)
                    .then(response => {
                        if (!response.ok) throw new Error(`Ошибка: ${response.status}`);
                        return response.text();
                    })
                    .then(text => {
                        appDiv.innerHTML = "";
                        searchBox.style.display = "block"; 

                        if (fileExt === 'json') {
                            const data = JSON.parse(text);
                            const cardsGrid = document.createElement("div");
                            cardsGrid.className = "cards-grid";

                            data.forEach(item => {
                                if (item.head !== undefined) {
                                    const hd = document.createElement("div");
                                    hd.className = "block-header";
                                    hd.innerHTML = `<h1>${item.head}</h1>${item.subhead ? `<p style="opacity:0.8">${item.subhead}</p>` : ""}`;
                                    appDiv.appendChild(hd);
                                } else {
                                    const cd = document.createElement("div");
                                    cd.className = "info-card";
                                    cd.innerHTML = `<div class="info-label"><i class="fas fa-bars-staggered"></i> ${item.title}</div><div>${item.text}</div>`;
                                    cardsGrid.appendChild(cd);
                                }
                            });
                            appDiv.appendChild(cardsGrid);
                        } else if (fileExt === 'md') {
                            const mdDiv = document.createElement("div");
                            mdDiv.className = "info-card markdown-body";
                            mdDiv.innerHTML = marked.parse(text, { gfm: true });
                            appDiv.appendChild(mdDiv);
                            enhanceMarkdown(mdDiv);
                        } else {
                            const txtDiv = document.createElement("div");
                            txtDiv.className = "info-card txt-body";
                            txtDiv.innerHTML = `<pre>${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</pre>`;
                            appDiv.appendChild(txtDiv);
                        }

                        initSmartSearch(appDiv);

                        // Переход по #якорю из адресной строки (если не задан поиск)
                        if (window.location.hash && !urlParams.get('search')) {
                            setTimeout(() => scrollToHash(appDiv, window.location.hash, false), 150);
                        }
                    })
                    .catch(err => {
                        appDiv.innerHTML = `<div class="status-message error"><i class="fas fa-times-circle"></i><span>Не удалось загрузить файл<br>${err.message}</span></div>`;
                    });
            });
        </script>
